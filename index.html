<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Silsilah Banu Mansur</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Plus+Jakarta+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<!-- LOGIN SCREEN -->
<div class="login-wrap" id="loginScreen" style="display:none;">
  <div class="login-brand">
    <span class="login-brand-icon">🕌</span>
    <h2>Silsilah Banu Mansur</h2>
  </div>
  <p class="sub" id="loginSubtitle">Masuk dengan email keluarga untuk melihat &amp; mengedit data.</p>
  <div class="login-error" id="loginError"></div>
  <input type="text" id="loginName" placeholder="Nama Anda (mis. Ahmad)" style="display:none;">
  <input type="text" id="loginRegion" placeholder="Wilayah/Cabang (opsional)" style="display:none;">
  <input type="email" id="loginEmail" placeholder="Email">
  <input type="password" id="loginPassword" placeholder="Kata sandi">
  <button class="btn btn-primary" id="loginSubmitBtn" onclick="doLogin()">Masuk</button>
  <button type="button" class="login-forgot" id="forgotPasswordBtn" onclick="doForgotPassword()">Lupa kata sandi?</button>
  <div class="login-alt" id="loginToggleMode" onclick="toggleAuthMode()">Belum punya akun? Daftar di sini</div>
</div>

<div class="app" id="appRoot" style="display:none;">

  <!-- TOOLBAR -->
  <div class="toolbar">
    <div class="toolbar-row toolbar-row-1">
      <button class="btn btn-ghost" onclick="goHome()" title="Kembali ke leluhur utama" aria-label="Kembali ke leluhur utama">🏛️</button>

      <!-- Dropdown Aksi -->
      <div class="dropdown-wrap" id="aksiDropdownWrap">
        <button class="btn btn-ghost dropdown-toggle" onclick="toggleDropdown('aksiDropdownWrap')" aria-haspopup="true" aria-expanded="false">⚙️ Aksi ▾</button>
        <div class="dropdown-menu" id="aksiDropdownMenu">
          <button onclick="closeDropdowns(); enterAddParentMode(currentId)">👴 Tambah Leluhur</button>
          <button onclick="closeDropdowns(); openCatatan()">📝 Catatan Nasab</button>
          <button onclick="closeDropdowns(); openAuditLog()">📜 Riwayat Perubahan</button>
          <hr>
          <button onclick="closeDropdowns(); handleDownloadBackup()" title="Unduh seluruh data sebagai file JSON">💾 Unduh Data (Backup)</button>
          <button onclick="closeDropdowns(); document.getElementById('restoreFileInput').click()" title="Pulihkan data dari file backup JSON">📤 Pulihkan Backup</button>
        </div>
        <input type="file" id="restoreFileInput" accept="application/json" style="display:none" onchange="handleRestoreFile(this)">
      </div>

      <!-- View Toggle: Grid, Pohon (Horizontal) & Pohon (Radial) -->
      <div class="view-toggle" role="group" aria-label="Pilih tampilan">
        <button class="active" id="gridBtn" title="Tampilan grid" aria-label="Tampilan grid" aria-pressed="true">❏</button>
        <button id="treeBtn" title="Tampilan pohon" aria-label="Tampilan pohon" aria-pressed="false">⌗</button>
        <button id="radialBtn" title="Tampilan pohon radial" aria-label="Tampilan pohon radial" aria-pressed="false">◎</button>
      </div>

      <div class="toolbar-spacer"></div>

      <span class="save-status" id="saveStatus" role="status" aria-live="polite">
        <span class="dot2"></span><span id="saveStatusText">Tersimpan</span>
      </span>

      <div class="search">
        <span aria-hidden="true">🔍</span>
        <input placeholder="Cari nama…" id="searchBox" aria-label="Cari nama" autocomplete="off">
        <div class="search-global-results" id="searchGlobalResults"></div>
      </div>

      <div class="dropdown-wrap" id="userDropdownWrap">
        <button class="user-chip" onclick="toggleDropdown('userDropdownWrap')">
          👤 <span class="chip-label" id="userEmailLabel"></span> ▾
        </button>
        <div class="dropdown-menu dropdown-menu-right" id="userDropdownMenu">
          <button onclick="closeDropdowns(); openProfileEditor()">👤 Profil</button>
          <button onclick="closeDropdowns(); doLogout()">🚪 Keluar</button>
        </div>
      </div>
    </div>

    <!-- Baris 2: Kinship line (bin/binti) -->
    <div class="toolbar-row toolbar-row-2">
      <div class="kinship-line" id="kinshipLine"></div>
    </div>
  </div>

  <!-- BODY -->
  <div class="body">
    <!-- SIDEBAR dengan collapsible -->
    <div class="sidebar">
      <div class="sidebar-header">
        <div class="sidebar-title">Pohon Keluarga</div>
        <button class="sidebar-collapse-all" onclick="collapseAllSidebar()" title="Tutup semua cabang">⊟</button>
        <button class="sidebar-expand-root" onclick="expandRootSidebar()" title="Buka tingkat pertama">⊞</button>
      </div>
      <div id="sidebarTree"></div>
    </div>
    <div class="sidebar-resizer" id="sidebarResizer" title="Seret untuk mengubah lebar sidebar"></div>

    <div class="content" id="contentArea">
      <div class="content-heading">
        <h2 id="heading"></h2>
        <span class="pair" id="pairLabel"></span>
      </div>
      <div class="content-scroll">
        <div class="empty-hint" id="emptyHint" style="display:none;"></div>
        <div class="card-grid" id="cardGrid"></div>

        <!-- Tree View Canvas -->
        <div class="tree-view-wrap" id="treeViewWrap">
          <div class="tree-view-canvas" id="treeViewCanvas"></div>
          <div class="tree-hint" aria-hidden="true">Geser = pan · Scroll/Cubit = zoom · Klik +/− = buka/tutup</div>
          <div class="tree-controls" role="group" aria-label="Kontrol zoom">
            <button type="button" id="treeZoomIn"    title="Perbesar"   aria-label="Perbesar">＋</button>
            <button type="button" id="treeZoomOut"   title="Perkecil"  aria-label="Perkecil">－</button>
            <button type="button" id="treeZoomReset" title="Atur ulang" aria-label="Atur ulang">⟳</button>
          </div>
        </div>
      </div>

      <!-- Detail overlay -->
      <div class="overlay" id="overlay">
        <div class="panel" id="detailPanel"></div>
      </div>

      <!-- Context menu -->
      <div class="ctx-menu" id="ctxMenu">
        <button data-act="open">📂 Buka</button>
        <button data-act="edit">✏️ Edit data</button>
        <button data-act="assignparent">💍 Tentukan Ibu/Ayah</button>
        <button data-act="addchild">➕ Tambah anak</button>
        <button data-act="olderSibling">⬆️ Jadikan kakak</button>
        <button data-act="youngerSibling">⬇️ Jadikan adik</button>
        <hr>
        <button data-act="delete" class="danger">🗑️ Hapus</button>
      </div>

      <!-- Modal kedua -->
      <div class="overlay" id="modalOverlay">
        <div class="panel" id="modalPanel" style="width:460px;"></div>
      </div>
    </div>
  </div>

  <!-- STATUS BAR -->
  <div class="statusbar">
    <span id="statPath"></span>
    <span class="dot">•</span>
    <span id="statGen"></span>
    <div class="breadcrumb full-path" id="breadcrumb"></div>
  </div>

</div>

<!-- Firebase SDK -->
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>

<!-- Modul aplikasi (urutan penting: db → utils → person → tree → ui → app) -->
<script src="db.js"></script>
<script src="utils.js"></script>
<script src="person.js"></script>
<script src="tree.js"></script>
<script src="ui.js"></script>
<script src="app.js"></script>

<script>
/* ===== Tombol sidebar collapse/expand all ===== */
function collapseAllSidebar() {
  expanded.clear();
  renderSidebar();
}
function expandRootSidebar() {
  rootIds.forEach(id => expanded.add(id));
  renderSidebar();
}

/* ===== Tombol pohon radial: aktifkan tree view + mode radial ===== */
document.getElementById('radialBtn').addEventListener('click', () => {
  viewMode = 'tree';
  document.getElementById('contentArea').classList.add('view-tree');
  document.getElementById('gridBtn').classList.remove('active');
  setTreeMode('radial');
});
</script>
</body>
</html>
